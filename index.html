<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060A12" />
    <script>
      try {
        if (localStorage.getItem('app-shell:theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').content = '#f4f6f6'
        }
      } catch {
        // El tema oscuro también funciona cuando el almacenamiento está restringido.
      }
    </script>
    <title>AppShell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
